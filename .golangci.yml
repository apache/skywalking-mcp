version: "2"
linters:
  enable:
    - bodyclose
    - dogsled
    - dupl
    - funlen
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - lll
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unparam
    - whitespace
  settings:
    dupl:
      threshold: 200
    funlen:
      lines: 100
      statements: 50
    goconst:
      min-len: 2
      min-occurrences: 2
      # Tool and schema property names, which mirror the struct json tags.
      ignore-strings: ^[a-z][a-z0-9_]*$
    gocritic:
      disabled-checks:
        - ifElseChain
        # Tool handlers take their input struct by value: the signature is
        # fixed by the SDK's ToolHandlerFor, so it cannot take a pointer.
        - hugeParam
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
    gocyclo:
      min-complexity: 15
    govet:
      enable:
        - shadow
    lll:
      line-length: 150
    misspell:
      locale: US
    whitespace:
      multi-if: false
      multi-func: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - goconst
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/apache/skywalking-mcp
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
