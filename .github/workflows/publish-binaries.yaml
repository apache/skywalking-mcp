name: publish-binaries

on:
  release:
    types:
      - released

jobs:
  build:
    if: github.repository == 'apache/skywalking-mcp'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.event.release.tag_name }}
          GIT_COMMIT: ${{ github.sha }}
        run: |
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          go build \
            -ldflags "-X main.version=${VERSION} -X main.commit=${GIT_COMMIT} -X main.date=${BUILD_DATE}" \
            -o bin/swmcp \
            cmd/skywalking-mcp/main.go
      - name: Create archive
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          tar -czf swmcp-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz -C bin swmcp
      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.event.release.tag_name }}
        run: gh release upload "${VERSION}" swmcp-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
