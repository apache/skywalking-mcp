name: publish-docker

on:
  push:
    branches:
      - main
  release:
    types:
      - released

env:
  SKIP_TEST: true
  APP_NAME: skywalking-mcp

jobs:
  build:
    if: github.repository == 'apache/skywalking-mcp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    env:
      VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      PLATFORMS: linux/amd64,linux/arm64
      HUB: ${{ github.event_name == 'release' && 'docker.io/apache' || 'ghcr.io/apache' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25
      - name: Build binary
        run: make build
      - name: Build docker image
        run: |
          make docker-build
          docker image ls
      - name: Log in to GHCR
        uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        if: github.event_name == 'release'
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push docker images
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'release'
        run: make docker-push
