name: publish-docker

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SKIP_TEST: true
  HUB: ghcr.io/apache/skywalking-mcp

jobs:
  build:
    if: github.repository == 'apache/skywalking-mcp'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    env:
      VERSION: ${{ github.sha }}
      APP_NAME: skywalking-mcp
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25
      - name: Build binary
        run: make build
      - name: Build docker image
        if: github.ref != 'refs/heads/main' # Only build docker image on PR(Push image when pushed to main branch)
        run: |
          make docker VERSION=${VERSION}
          docker image ls
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push docker images
        if: github.ref == 'refs/heads/main'
        run: make docker.push VERSION=${VERSION}
